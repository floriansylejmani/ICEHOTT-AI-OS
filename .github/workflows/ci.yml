name: ICEHOTT V2 — CI
on:
  push:
    branches: [main, 'phase/**', 'feature/**', 'fix/**']
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    env:
      ICEHOTT_POSTGRES_TEST_CONNECTION: 'Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd 'pg_isready -U postgres -d postgres'
          --health-interval 3s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet test ICEHOTT.AIOS.sln --configuration Release
  ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
        working-directory: services/ai
      - run: python -m pytest -q
        working-directory: services/ai
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
